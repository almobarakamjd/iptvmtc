apply plugin: 'com.android.application'

// مفتاح التوقيع الثابت (خارج المستودع) — التوقيع بمفتاح debug كان يجعل Play Protect يحظر التثبيت
def ksProps = new Properties()
def ksFile = new File(System.getProperty('user.home'), 'keystores/oqod-release.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
    namespace 'com.smarttvplus.iptvmtc'
    compileSdk 34

    defaultConfig {
        applicationId 'com.smarttvplus.iptvmtc'
        minSdk 21          // أندرويد 5.0 فأعلى — يغطي أجهزة MTC والبوكسات القديمة
        targetSdk 34
        versionCode 18
        versionName '1.7.2'
    }

    buildFeatures { buildConfig true }

    /* نسختان من نفس الكود: tv للتلفاز والبوكسات (كما كانت)، وmobile للجوال بلا خدمة الإتاحة ولا
       مسؤول الجهاز — وجودهما يجعل Play Protect يحظر التثبيت على الجوال حظراً تاماً بلا خيار تجاوز.
       ملف التوزيع: tv ← SmartTVPlus.apk، mobile ← myTvMobile.apk (المحدِّث يختار رابطه بـBuildConfig.FLAVOR) */
    flavorDimensions 'device'
    productFlavors {
        tv { dimension 'device' }
        mobile { dimension 'device' }
    }

    signingConfigs {
        if (ksProps['storeFile']) {
            oqod {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksProps['storeFile'] ? signingConfigs.oqod : signingConfigs.debug
        }
        // نسخة التطوير للمحاكي فقط — ملف التوزيع هو release الموقّع بمفتاح oqod
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
