apply plugin: 'com.android.application'

// مفتاح التوقيع الثابت (خارج المستودع) — التوقيع بمفتاح debug كان يجعل Play Protect يحظر التثبيت
// مفتاح Claude لـ«المساعد الذكي»: المصدر نفسه الذي يُبنى به Player+ (خارج المستودع)، أو متغير البيئة
def aiProps = new Properties()
def aiFile = rootProject.file('../../movie_player/secrets.properties')
if (aiFile.exists()) aiFile.withInputStream { aiProps.load(it) }
def aiKey = aiProps.getProperty('ANTHROPIC_API_KEY') ?: (System.getenv('ANTHROPIC_API_KEY') ?: '')

def ksProps = new Properties()
def ksFile = new File(System.getProperty('user.home'), 'keystores/oqod-release.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
    namespace 'com.smarttvplus.iptvmtc'
    compileSdk 34

    defaultConfig {
        applicationId 'com.smarttvplus.iptvmtc'
        minSdk 26          // أندرويد 8 فأعلى: مكتبة Claude تتطلبه (كان 21). MTC أندرويد 9 وTCL أندرويد 12
        targetSdk 34
        versionCode 29
        versionName '1.7.13'
        buildConfigField 'String', 'ANTHROPIC_API_KEY', '"' + aiKey + '"'
    }

    buildFeatures { buildConfig true }

    /* نسختان من نفس الكود: tv للتلفاز والبوكسات (كما كانت)، وmobile للجوال بلا خدمة الإتاحة ولا
       مسؤول الجهاز — وجودهما يجعل Play Protect يحظر التثبيت على الجوال حظراً تاماً بلا خيار تجاوز.
       ملف التوزيع: tv ← SmartTVPlus.apk، mobile ← myTvMobile.apk (المحدِّث يختار رابطه بـBuildConfig.FLAVOR) */
    flavorDimensions 'device'
    productFlavors {
        tv { dimension 'device' }
        mobile { dimension 'device' }
    }

    signingConfigs {
        if (ksProps['storeFile']) {
            oqod {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksProps['storeFile'] ? signingConfigs.oqod : signingConfigs.debug
        }
        // نسخة التطوير للمحاكي فقط — ملف التوزيع هو release الموقّع بمفتاح oqod
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/versions/**', 'META-INF/DEPENDENCIES',
                         'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    // «المساعد الذكي» (AiDoctor): النسخة نفسها التي يعمل بها Player+ على الأجهزة
    implementation 'com.anthropic:anthropic-java:2.63.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
